name: Ching Win one-shot live product preview

on:
  push:
    branches: [codex/live-chingwin-browser-read]
    paths:
      - .github/workflows/chingwin-live-browser-read.yml
      - scripts/chingwin_browser_read.mjs

permissions:
  contents: read

jobs:
  live-browser-read:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: google-chrome --version
      - name: Open one public product and validate its saved HTML
        run: |
          day=$(TZ=Asia/Taipei date +%F)
          inbox="$RUNNER_TEMP/chingwin-live-inbox"
          mkdir -p "$inbox/$day/manga"
          CHINGWIN_TEST_HTML_OUT="$inbox/$day/manga/101018X108.html" \
            xvfb-run --auto-servernum node scripts/chingwin_browser_read.mjs --headed --product
          python -m app.chingwin_saved_update --inbox "$inbox" --date "$day" --output chingwin-live-preview.json
          python -c 'import json; data = json.load(open("chingwin-live-preview.json", encoding="utf-8")); assert data["status"] == "preview"; [book] = data["books"]; assert book["source_key"] == "101018X108" and book["author"]; print("Live product HTML validated by the offline importer")'
      - uses: actions/upload-artifact@v4
        with:
          name: chingwin-live-preview
          path: chingwin-live-preview.json
          if-no-files-found: error
          retention-days: 7
