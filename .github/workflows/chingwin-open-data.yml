name: Chingwin monthly open-data review

on:
  schedule:
    - cron: "17 1 6 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ncl-review:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare NCL open-data files without catalog access
        shell: bash
        run: |
          set -o pipefail
          python -m app.chingwin_coverage --ncl-months 3 --monthly-candidates \
            --baseline tests/fixtures/chingwin_oct_nov_2026_sample.json \
            --out chingwin-ncl-review.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: chingwin-ncl-review
          path: chingwin-ncl-review.json
          if-no-files-found: error
          retention-days: 40
