name: Scheduled catalog update

on:
  schedule:
    # 08:15 Asia/Taipei (GitHub cron uses UTC).
    - cron: "15 0 * * *"
  workflow_dispatch:
    inputs:
      test_email_only:
        description: Send one Gmail SMTP test email without updating publishers
        required: false
        default: false
        type: boolean
      test_database_only:
        description: Test the TiDB connection without updating publishers
        required: false
        default: false
        type: boolean
      test_email_user_id:
        description: Send a Gmail SMTP test to one AniShelf user id
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: anishelf-scheduled-update
  cancel-in-progress: false

jobs:
  update-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ANISHELF_CLOUD_MODE: "true"
      ANISHELF_AUTO_UPDATE: "false"
      ANISHELF_DB_SSL_MODE: verify_identity
      ANISHELF_DB_HOST: ${{ secrets.ANISHELF_DB_HOST }}
      ANISHELF_DB_PORT: ${{ secrets.ANISHELF_DB_PORT }}
      ANISHELF_DB_NAME: ${{ secrets.ANISHELF_DB_NAME }}
      ANISHELF_DB_USER: ${{ secrets.ANISHELF_DB_USER }}
      ANISHELF_DB_PASSWORD: ${{ secrets.ANISHELF_DB_PASSWORD }}
      ANISHELF_DISCORD_WEBHOOK_URL: ${{ secrets.ANISHELF_DISCORD_WEBHOOK_URL }}
      ANISHELF_SMTP_HOST: ${{ secrets.ANISHELF_SMTP_HOST }}
      ANISHELF_SMTP_PORT: ${{ secrets.ANISHELF_SMTP_PORT }}
      ANISHELF_SMTP_USERNAME: ${{ secrets.ANISHELF_SMTP_USERNAME }}
      ANISHELF_SMTP_PASSWORD: ${{ secrets.ANISHELF_SMTP_PASSWORD }}
      ANISHELF_EMAIL_FROM: ${{ secrets.ANISHELF_EMAIL_FROM }}
      ANISHELF_SMTP_STARTTLS: "true"
      ANISHELF_NOTIFICATION_LEAD_DAYS: "7,3,1,0"
      ANISHELF_PUBLIC_URL: https://anishelf-wmcu.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate database secrets
        if: ${{ github.event_name == 'schedule' || inputs.test_email_only != true }}
        shell: bash
        run: |
          for name in ANISHELF_DB_HOST ANISHELF_DB_PORT ANISHELF_DB_NAME ANISHELF_DB_USER ANISHELF_DB_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub secret: $name"
              exit 1
            fi
          done
      - name: Update publishers and send notifications
        if: ${{ github.event_name == 'schedule' || (inputs.test_email_only != true && inputs.test_database_only != true && inputs.test_email_user_id == '') }}
        run: python -m app.scheduled
      - name: Test TiDB connection
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_database_only == true }}
        run: python -m app.database_check
      - name: Send Gmail SMTP test email
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_email_only == true }}
        run: python -m app.notifications --test-email
      - name: Send account Gmail SMTP test email
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_email_user_id != '' }}
        env:
          ANISHELF_TEST_USER_ID: ${{ inputs.test_email_user_id }}
        run: python -m app.notifications --test-user-id "$ANISHELF_TEST_USER_ID"
